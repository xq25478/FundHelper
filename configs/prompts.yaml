  ---
  请按以下“零章节 + 六个分析部分”依次输出专业分析报告：

  # 零、数据可信度与缺失原因

  - 必须原样使用“程序生成数据可信度表”，不得自行重写可用性状态。
  - 若程序生成表显示大盘现货量价或资金流可用/部分可用，不得在正文中声称该域整体缺失。
  - 只能把程序生成表中明确标为“缺失”的数据写成未接入；若同类排名、估值分位、北向资金、融资融券、成交量/成交额或资金流显示为可用/部分可用，正文必须按表内口径引用，不得再写成缺失。
  - 严禁在零章节后新增另一张“数据域 / 覆盖 / 可用性”表格。
    程序生成表已经覆盖所有数据域；模型若另写一张“未接入”表，会被自动后处理删除并标注冲突。
  - 若想表达“某结论不能下”，请直接写结论级判断（如“因排名分位接近 0%/50%，本期不展开同类胜率讨论”），
    不要重新声明数据接入状态。

  # 一、大盘研判

  - 宽基指数结构分化、量价关系、资金流、走势图结构、风格轮动
  - 必须引用实时大盘中已经提供的成交额、当前量/5日均量、K线/均线结构、60日高点回撤；若只有盘中快照，写“盘中快照口径”，不得写成成交额整体缺失
  - 外部映射：只引用高相关消息，不得强行映射低相关新闻
  - 流动性/政策/事件风险扫描；资金流数据为空时明确写缺口

  # 二、主力意图分析

  - 必须引用“主力意图分析事实框架”中的资金流、指数确认、板块宽度和持仓主题强弱。
  - 如果上方已出现“主力意图分析事实框架（程序生成）”，必须使用其中表格，不得写“程序未提供主力意图分析事实框架”。
  - 输出主力意图倾向：进攻性增仓 / 减仓避险 / 结构性抱团 / 低吸护盘 / 调仓换线 / 震荡观望。
  - 必须说明证据强度、与价格走势是否互相确认、与当前持仓主题的关系。
  - 必须写出反证条件：哪些资金流或板块宽度变化会推翻当前判断。
  - 如果资金流缺失，只能写“无法验证主力意图”，不得用涨跌幅倒推主力资金流。
  - 避免“清仓/满仓”等强交易词；即便表达否定，也改写为“不是退出主线”。

  # 三、板块轮动

  - 板块一致性诊断 + 轮动阶段判定
  - 关注板块逐一分析（AI/半导体/通信/算力硬件/PCB/CPO/光模块；电力/新能源为观察板块），每个含今日强弱/K 线趋势形态/催化/未来方向
  - 海外映射信号（英伟达/特斯拉/SpaceX）
  - 市场动态（重点公司消息）：必须引用上方程序表；若表格已有公司行，按“公司-消息-可能影响的基金/板块-证据强度”简要列出；只有程序表明确暂无命中时，才可写暂无新增。

  # 四、持仓诊断与操作建议

  - 组合全景：风险暴露矩阵、风格一致性检验、组合风险收益比（Sharpe）/最大回撤；必须用一句话解释这些指标代表什么
  - 逐只基金穿透：业绩归因 + 重仓股验证 + 公司级消息复核 + 风格暴露 + 操作建议（持有/增持/减持 ±x%）+ 止错信号
  - 绩效百分比（近1月涨幅、年化波动、最大回撤、超额收益等）必须放在逐只诊断段落，不要塞入“组合操作建议表”的理由列
  - 组合操作建议表：

  | 基金 | 当前权重 | 建议权重 | 操作 | 理由 | 止错信号 |
  |---|---|---|---|---|---|

  - 上表“建议权重”只能填 0%-25% 以内的单一数值或窄区间；理由列只写定性原因，不写大于25%的收益/波动/回撤百分比。
  - 上表每个单元格必须短句化，避免邮件表格拥挤；基金诊断细节放在表格前的逐只基金段落中。

  - 再平衡策略 + 前瞻关注（未来 2 周关键事件）

  # 五、分时间窗趋势分析

  必须分别覆盖 A 股大盘、重点板块、持有基金三类对象，并使用下方表格：

  | 对象 | 时间窗 | 方向倾向 | 置信度 | 核心证据 | 失效条件 |
  |---|---|---|---|---|---|
  | A 股大盘 | 下一个交易日 |  |  |  |  |
  | A 股大盘 | 未来 7 天 |  |  |  |  |
  | A 股大盘 | 本月剩余窗口 |  |  |  |  |
  | 重点板块：AI/半导体/通信/算力硬件/PCB/CPO/光模块 | 下一个交易日 |  |  |  |  |
  | 重点板块：AI/半导体/通信/算力硬件/PCB/CPO/光模块 | 未来 7 天 |  |  |  |  |
  | 重点板块：AI/半导体/通信/算力硬件/PCB/CPO/光模块 | 本月剩余窗口 |  |  |  |  |
  | 持有基金：逐只基金 | 下一个交易日 |  |  |  |  |
  | 持有基金：逐只基金 | 未来 7 天 |  |  |  |  |
  | 持有基金：逐只基金 | 本月剩余窗口 |  |  |  |  |

  - “持有基金：逐只基金”必须展开到当前持仓中的每一只基金，不得只写组合整体。
  - 下一个交易日判断侧重盘面承接和隔夜映射；未来 7 天侧重轮动与风险释放；本月侧重月末流动性、政策窗口和趋势延续/反转条件。

  # 六、风险复核与跟踪清单

  - 列出 5 个未来需要跟踪的证据项：主力资金、板块宽度、核心指数位置、持仓主题承接、消息催化兑现。
  - 每项写清触发后的动作倾向，但不得输出确定性买卖指令。

