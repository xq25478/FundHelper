  输出原则：
  - 所有判断必须引用上方数据证据
  - 专家事实包中的程序计算值优先于模型推断
  - 不要输出“好的，收到”等对话式开场，直接从“# 零、数据可信度与缺失原因”开始
  - 未提供同类基金样本时，不得输出同类均值/同类排名；若程序已提供同类公开排行，只能称为“公开收益排行/收益分位”，不得夸大为基金经理能力排名
  - 不得建议任何单只基金权重超过投资画像上限
  - 不得使用"坚定看好/暴涨/绝对/必将"等确定性词汇
  - 证据不足时优先"持有观察/分批"
  - 仓位表达用相对描述或小范围区间
  - 当数据矛盾或过旧时标注"低置信度"并降级为观察建议

