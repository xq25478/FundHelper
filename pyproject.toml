[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-helper"
version = "0.1.0"
description = "A-share public fund analysis helper: screening, metrics, backtest, reports."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "xiaoqi.31" }]
license = { text = "MIT" }
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "requests>=2.31",
    "akshare>=1.13",
    "pyarrow>=15",
    "efinance>=0.5",
]

[project.optional-dependencies]
duckdb = ["duckdb>=0.10"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "black>=24.0"]

[project.scripts]
fh = "fund_helper.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
